<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive real-time digital clock built with HTML, CSS and JavaScript">

    <title>Digital Clock | Task 6</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <section class="clock-card">

            <p class="heading">CURRENT TIME</p>

            <div class="time" id="time">
                00:00:00
            </div>

            <div class="period" id="period">
                AM
            </div>

            <div class="date" id="date">
                Loading date...
            </div>

            <div class="timezone">
                <span class="status-dot"></span>
                Local Time
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
